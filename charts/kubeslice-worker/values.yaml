operator:
  image: ghcr.io/kube-slice/worker-operator
  pullPolicy: IfNotPresent
  logLevel: INFO
  tag: v2026.1.15
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

## Base64 encoded secret values from controller cluster
controllerSecret:
  namespace:
  endpoint:
  ca.crt:
  token:

cluster:
  name:
  nodeIp: # This field is deprecated. You can set nodeIPs through cluster spec.
  endpoint:

router:
  image: ghcr.io/kube-slice/cmd-nse-vl3
  tag: v2026.1.15
  pullPolicy: IfNotPresent

routerSidecar:
  image: ghcr.io/kube-slice/router-sidecar
  tag: v1.5.0-ac
  pullPolicy: IfNotPresent


gateway:
  image: ghcr.io/kube-slice/gateway-sidecar
  tag: v1.1.0-ac
  pullPolicy: IfNotPresent
  logLevel: INFO

gatewayEdge:
  image: ghcr.io/kube-slice/slicegw-edge
  tag: v1.1.0-ac

openvpn:
  server:
    image: ghcr.io/kube-slice/openvpn-server.alpine
    tag: v1.0.4
    pullPolicy: IfNotPresent
  client:
    image: ghcr.io/kube-slice/openvpn-client.alpine
    tag: v1.0.4
    pullPolicy: IfNotPresent

wireguard:
  server:
    image: ghcr.io/kube-slice/wireguard-server.alpine
    tag: v2026.1.15
    pullPolicy: IfNotPresent
  client:
    image: ghcr.io/kube-slice/wireguard-client.alpine
    tag: v2026.1.15
    pullPolicy: IfNotPresent

dns:
  image: ghcr.io/kube-slice/dns
  tag: v0.2.0-ac
  pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 50m
      memory: 128Mi

jaeger:
  enabled: false

events:
  disabled: true

imagePullSecrets:
  - name: regcred

# change ths value for intracluster where controller cluster is in same cluster as worker as is different from default
controllerNamespace: kubeslice-controller

global:
  imageRegistry: ghcr.io/kube-slice
  distro:
    openshift: false
    ubi: ""

# enable/disable network component installation
kubesliceNetworking:
  enabled: true

nsm:
  spire:
    priorityClassName: ""
    spire-server:
      priorityClassName: ""
    spiffe-csi-driver:
      priorityClassName: ""

ocm:
  enabled: false

apiserver:
  servingCerts:
    generate: true
    caCrt: ""
    serverCrt: ""
    serverKey: ""

# kube-rbac-proxy sidecar on the worker-operator. Empty by default to preserve
# the previous BestEffort behaviour; set by values-{dev,stage,prod}.yaml.
rbacproxy:
  resources: {}
