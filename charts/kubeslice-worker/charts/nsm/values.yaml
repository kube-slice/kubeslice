---
# Default values for nsm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

insecure: true
global:
  nsm_docker_existingImagePullSecret: "kubeslice-image-pull-secret"
  # IF You dont have existing secret then pass all below values it will create new secret "avesha-docker-ips"
  ## MANDOTORY FIELDS IF EXISTING SECRET NOT PRESENT ##
  nsm_docker_imagePullSecrets:
    repository:
    username: ''
    password: ''
    email: ''
  imageRegistry: ghcr.io/kube-slice
  # set to true to enable Jaeger tracing for NSM components
  JaegerTracing: true

forwardingPlane:
  kernelImageRegistry: cmd-forwarder-kernel
  kernelImageTag: v2026.1.15
  # Datapath forwarder. Sized by the number of NSM connections on the node and
  # spikes during connection churn (heal storms), not by steady-state traffic.
  resources:
    requests:
      cpu: 150m
    limits:
      memory: 500Mi
      cpu: 525m

nsmgr:
  imageRegistry: cmd-nsmgr
  imageTag: v2026.1.15
  waitForItImageRegistry: wait-for-it
  waitForItImageTag: v1.1.0-ac
  excludePrefixesImageRegistry: cmd-exclude-prefixes-k8s
  excludePrefixesImageTag: v1.5.4
  resources:
    requests:
      cpu: 200m
      memory: 100Mi
    limits:
      memory: 200Mi
      cpu: 500m
  excludePrefixesResources:
    limits:
      memory: 40Mi
      cpu: 75m

registryK8sImageRegistry: cmd-registry-k8s
registryK8sImageTag: v2026.1.15
registryK8sResources:
  requests:
    cpu: 200m
  limits:
    memory: 100Mi
    cpu: 600m

nscgrpc:
  cmdnscgrpcServerImageRegistry: cmd-nsc
  cmdnscgrpcServerImageTag: v2026.1.15

  # Empty by default to preserve the previous behaviour, where this container
  # declared no resources and therefore ran as BestEffort. The environment
  # values files set it -- see values-{dev,stage,prod}.yaml.
  resources: {}