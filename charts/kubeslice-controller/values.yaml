# Default values for k-native.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

kubeslice:
  rbacproxy:
    image: ghcr.io/appscode/kube-rbac-proxy
    tag: v0.18.2
    # Empty by default to preserve the previous BestEffort behaviour;
    # set by values-{dev,stage,prod}.yaml.
    resources: {}
  controller:
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    logLevel: debug
    rbacResourcePrefix: kubeslice-rbac
    projectnsPrefix: kubeslice
    endpoint:
    image: ghcr.io/kube-slice/kubeslice-controller
    tag: v2026.1.15
    pullPolicy: IfNotPresent
  ovpnJob:
    image: ghcr.io/kube-slice/gateway-certs-generator
    tag: v0.7.0-ac
  events:
    disabled: false

ocm:
  enabled: false
  placement:
    create: true
    name: global

distro:
  openshift: false
  ubi: ""
